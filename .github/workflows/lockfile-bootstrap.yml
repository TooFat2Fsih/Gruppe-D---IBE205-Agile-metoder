name: Bootstrap npm lockfile

on:
  push:
    branches:
      - feature/nextjs-app-foundation
    paths:
      - ".github/workflows/lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'jgaseland/Gruppe-D---IBE205-Agile-metoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile from npm registry
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
          else
            git commit -m "build: add npm dependency lockfile"
            git push origin HEAD:feature/nextjs-app-foundation
          fi
